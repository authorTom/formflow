# FormFlow — Docker Compose
#
# Production (pull the prebuilt image):
#   docker compose up -d            -> http://localhost:8080
#
# Development (live-reloading Vite + API; needs a source checkout):
#   docker compose --profile dev up dev
#                                   -> http://localhost:5173
#
# Compose reads a sibling ".env" automatically for the ${...} values below.
# Copy .env.example to .env to change the port, pin an image tag, or set limits.

services:
  web:
    # Multi-arch image published by .github/workflows/docker.yml on every push
    # to main. GHCR lowercases the owner (authorTom -> authortom).
    image: ${FORMFLOW_IMAGE:-ghcr.io/authortom/formflow:latest}

    # --- Build from source instead of pulling (optional) ------------------
    # Requires the full repo checkout on the host. Uncomment and run
    # `docker compose up -d --build` to build locally rather than pull.
    # build:
    #   context: .

    ports:
      - "${FORMFLOW_PORT:-8080}:8080"
    init: true                 # PID 1 signal forwarding + zombie reaping
    restart: unless-stopped

    environment:
      # Largest file a respondent may attach to a file-upload question, in MB.
      FORMFLOW_MAX_UPLOAD_MB: "${FORMFLOW_MAX_UPLOAD_MB:-10}"
      # Public write requests allowed per IP per minute.
      FORMFLOW_RATE_LIMIT: "${FORMFLOW_RATE_LIMIT:-120}"
      # How long a sign-in lasts, in days.
      FORMFLOW_SESSION_TTL_DAYS: "${FORMFLOW_SESSION_TTL_DAYS:-30}"
      # Set to "true" when a TLS-terminating proxy sits in front of this and you
      # want session cookies marked Secure unconditionally.
      FORMFLOW_SECURE_COOKIES: "${FORMFLOW_SECURE_COOKIES:-false}"

    volumes:
      # The SQLite database and uploaded files. A named volume survives
      # `docker compose down` and image upgrades; swap in a host path
      # (e.g. ./data:/data) to keep them somewhere you can back up directly —
      # the host directory must be writable by uid 1000.
      - formflow-data:/data

    healthcheck:
      # Array (exec) form keeps the "://" and ":8080" out of YAML's way. busybox
      # wget ships in the node-alpine runtime image; the slim image has no curl.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Containerised dev environment: mounts the working tree and runs the Vite dev
  # server alongside the API with hot reload, so no local Node install is needed.
  # Only works from a full source checkout (it bind-mounts ".").
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:docker"
    init: true
    environment:
      FORMFLOW_DATA_DIR: /data
    volumes:
      - .:/app
      # Named volumes keep container node_modules and dev data off the host tree.
      - node_modules:/app/node_modules
      - formflow-dev-data:/data
    ports:
      - "5173:5173"   # Vite (the UI you open)
      - "8080:8080"   # API, proxied by Vite

volumes:
  formflow-data:
  formflow-dev-data:
  node_modules:
